name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywin32

      - name: Build HardLock.exe
        run: |
          pyinstaller --onefile --windowed --name "HardLock" --icon=icon.png app.py

      - name: Get version from app.py
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'APP_VERSION = "\K[^"]+' app.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: HardLock v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automatic release built from `main`.
            
            **Version:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}
            
            Download `HardLock.exe` below and replace your existing copy.
            Any active focus session will be offered for resume on next launch.
          files: |
            dist/HardLock.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
